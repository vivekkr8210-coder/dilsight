<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password — Dilsight</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Create New Password
            </h1>

            <p class="auth-subtitle">
                Enter your new password below.
            </p>

            <form id="resetPasswordForm">

                <label>
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

                <button
                    type="submit"
                    class="auth-main-btn"
                >
                    Update Password
                </button>

            </form>

            <p
                id="resetPasswordMessage"
                class="auth-message"
            ></p>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>

</html>
