<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password — Dilsight</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Reset Your Password
            </h1>

            <p class="auth-subtitle">
                Enter your registered email address
                and we'll send you a password reset link.
            </p>

            <form id="forgotPasswordForm">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="resetEmail"
                    placeholder="Enter your email"
                    required
                >

                <button
                    type="submit"
                    class="auth-main-btn"
                >
                    Send Reset Link
                </button>

            </form>

            <p
                id="resetMessage"
                class="auth-message"
            ></p>

            <p class="auth-bottom">

                <a href="login.html">
                    Back to Login
                </a>

            </p>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>

</html>
