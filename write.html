<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Write Your Story — Dilsight</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">
            Dil<span>sight</span>
        </div>

        <nav class="nav-links">

            <a href="index.html">Home</a>

            <a href="#">Poetry</a>

            <a href="#">Movie</a>

            <a href="#">Travel</a>

            <a href="#">Spirituality</a>

            <a href="#">Personal Essays</a>

        </nav>

        <div class="nav-right">

            <span id="loggedUser"></span>

            <button id="logoutBtn" class="login-btn">

                Logout

            </button>

        </div>

    </header>


    <main class="writer-page">

        <div class="writer-container">

            <h1>Write Your Story</h1>

            <p class="writer-intro">

                Share your thoughts, experiences and creativity
                with the Dilsight community.

            </p>


            <form id="storyForm">


                <!-- TITLE -->

                <label>Title</label>

                <input type="text" id="storyTitle" placeholder="Enter your story title..." required>


                <!-- CATEGORY -->

                <label>Category</label>

                <select id="storyCategory" required>

                    <option value="">
                        Select Category
                    </option>

                    <option value="Poetry">
                        Poetry
                    </option>

                    <option value="Movie">
                        Movie
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Spirituality">
                        Spirituality
                    </option>

                    <option value="Personal Essays">
                        Personal Essays
                    </option>

                </select>


                <!-- LANGUAGE -->

                <label>Language</label>

                <div class="language-choice">

                    <label>

                        <input type="radio" name="language" value="English" checked>

                        English

                    </label>


                    <label>

                        <input type="radio" name="language" value="Hindi">

                        Hindi

                    </label>

                </div>


                <!-- COVER -->

                <label>Cover Image</label>

                <input type="file" id="storyImage" accept="image/*">


                <!-- STORY -->

                <label>Your Story</label>

                <textarea id="storyContent" placeholder="Write your story here..." required></textarea>


                <div class="publish-area">

                    <button type="submit" id="publishArticleBtn" class="auth-main-btn">

                        Publish Article

                    </button>

                </div>

            </form>
            <!-- MY STORIES -->

            <section class="my-stories-section">

                <h2>My Stories</h2>

                <div id="myStoriesList">

                    <!-- Published stories will appear here -->

                </div>

            </section>
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>

</html>
